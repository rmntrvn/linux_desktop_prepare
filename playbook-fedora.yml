---
- name: Install basic components
  hosts: localhost
  become: true
  gather_facts: true
  vars:
    generic_package_names:
      RedHat:
        - apt-transport-https
        - ca-certificates
        - cups
        - curl
        - gnupg2-dirmngr
        - dmidecode
        - filezilla
        - fping
        - gimp
        - git-all
        - gnupg
        - htop
        - inkscape
        - iperf3
        - jq
        - keepassxc
        - make
        - mc
        - net-tools
        - nmap
        - obs-studio
        - openconnect
        - pavucontrol
        - postgresql
        - pwgen
        - qbittorrent
        - remmina
        - resolvconf
        - s3cmd
        - simplescreenrecorder
        - sshpass
        - tcpdump
        - telnet
        - testdisk
        - thunderbird
        - vim
        - vlc
        - wget
        - whois
        - wireguard-tools
        - wireshark
  roles:
    - role: install-packages
  tags:
    - install-packages

- name: Install VS Code
  hosts: localhost
  become: true
  gather_facts: true
  roles:
    - role: vscode

