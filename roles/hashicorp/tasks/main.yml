---
- name: Установка зависимостей (apt)
  ansible.builtin.apt:
    name:
      - gnupg
      - ca-certificates
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Установка зависимостей (dnf)
  ansible.builtin.dnf:
    name:
      - gnupg2
      - ca-certificates
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Создание директории для ключей (apt)
  ansible.builtin.file:
    path: '/etc/apt/keyrings'
    state: directory
    mode: 'u=rwx,go=rx'
  when: ansible_facts['os_family'] == 'Debian'

- name: Установка ключа GPG (apt)
  ansible.builtin.get_url:
    url: 'https://apt.releases.hashicorp.com/gpg'
    dest: '/etc/apt/keyrings/hashicorp-archive-keyring.gpg'
    mode: 'u=rw,go=r'
    force: yes
  when: ansible_facts['os_family'] == 'Debian'

- name: Добавление репозитория HashiCorp (apt)
  ansible.builtin.deb822_repository:
    name: hashicorp
    types: deb
    uris: https://apt.releases.hashicorp.com
    suites: "{{ ansible_facts['distribution_release'] | default('resolute') }}"
    components: [main]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/hashicorp-archive-keyring.gpg
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Установка пакетов HashiCorp (apt)
  ansible.builtin.apt:
    name: "{{ hashicorp_packages }}"
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Добавление репозитория HashiCorp (dnf)
  ansible.builtin.get_url:
    url: https://rpm.releases.hashicorp.com/fedora/hashicorp.repo
    dest: /etc/yum.repos.d/hashicorp.repo
    mode: '0644'
  when: ansible_facts['os_family'] == 'RedHat'

- name: Установка пакетов HashiCorp (dnf)
  ansible.builtin.dnf:
    name: "{{ hashicorp_packages }}"
    state: present
  when: ansible_facts['os_family'] == 'RedHat'
