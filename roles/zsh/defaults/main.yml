---
# Целевой пользователь (не root), для которого настраивается zsh/oh-my-zsh
zsh_user: "{{ ansible_env.SUDO_USER | default(lookup('env', 'USER')) | default('rmntrvn') }}"
# Домашний каталог целевого пользователя
zsh_home: "/home/{{ zsh_user }}"
zsh_theme: ys
zsh_plugins:
  - git
  - zsh-syntax-highlighting
  - zsh-autosuggestions
  - fzf
zsh_syntax_highlighting: true
zsh_syntax_highlighting_version: master
zsh_autosuggestions: true
zsh_autosuggestions_version: master
zsh_packages:
  - zsh-syntax-highlighting
  - zsh-autosuggestions
  - fzf
  - git
