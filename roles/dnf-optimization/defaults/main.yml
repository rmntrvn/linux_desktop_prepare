---
# Опции для оптимизации DNF
# Эти переменные можно переопределить в playbook

# Использовать fastestmirror для выбора самого быстрого зеркала
dnf_fastest_mirror: true

# Максимальное количество параллельных загрузок
dnf_max_parallel_downloads: 10

# Хранить кэш пакетов после установки
dnf_keepcache: true

# Время устаревания метаданных в секундах
dnf_metadata_expire: 86400

# Таймаут соединения в секундах
dnf_timeout: 30
