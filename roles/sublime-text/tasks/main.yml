---
- name: Установка зависимостей (apt)
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Установка зависимостей (dnf)
  ansible.builtin.dnf:
    name:
      - ca-certificates
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Создание директории для ключей (apt)
  ansible.builtin.file:
    path: '/etc/apt/keyrings'
    state: directory
    mode: 'u=rwx,go=rx'
  when: ansible_facts['os_family'] == 'Debian'

- name: Установка ключа подписи (apt)
  ansible.builtin.get_url:
    url: 'https://download.sublimetext.com/sublimehq-pub.gpg'
    dest: '/etc/apt/keyrings/sublimehq-archive.gpg'
    mode: 'u=rw,go=r'
    force: yes
  when: ansible_facts['os_family'] == 'Debian'

- name: Добавление репозитория sublime-text (apt)
  ansible.builtin.deb822_repository:
    name: sublime-text
    types: deb
    uris: https://download.sublimetext.com/
    suites: apt/stable/
    components: []
    signed_by: /etc/apt/keyrings/sublimehq-archive.gpg
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Установка ключа Sublime Text (dnf)
  ansible.builtin.rpm_key:
    key: https://download.sublimetext.com/sublimehq-rpm-pub.gpg
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Добавление репозитория sublime-text (dnf)
  ansible.builtin.yum_repository:
    name: sublime-text
    description: Sublime Text Repository
    baseurl: https://download.sublimetext.com/rpm/stable/x86_64/
    gpgkey: https://download.sublimetext.com/sublimehq-rpm-pub.gpg
    gpgcheck: true
    enabled: true
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Установка sublime-text (dnf)
  ansible.builtin.dnf:
    name: sublime-text
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'RedHat'

- name: Установка sublime-text (apt)
  ansible.builtin.apt:
    name: sublime-text
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'
