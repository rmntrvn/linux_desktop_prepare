---
- name: Установка зависимостей (apt)
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
    state: present
  when: ansible_os_family == 'Debian'

- name: Установка зависимостей (dnf)
  ansible.builtin.dnf:
    name:
      - ca-certificates
    state: present
  when: ansible_os_family == 'RedHat'

- name: Создание директории для ключей (apt)
  ansible.builtin.file:
    path: '/etc/apt/keyrings'
    state: directory
    mode: 'u=rwx,go=rx'
  when: ansible_os_family == 'Debian'

- name: Установка ключа подписи (apt)
  ansible.builtin.get_url:
    url: 'https://download.sublimetext.com/sublimehq-pub.gpg'
    dest: '/etc/apt/keyrings/sublimehq-archive.gpg'
    mode: 'u=rw,go=r'
    force: yes
  when: ansible_os_family == 'Debian'

- name: Добавление репозитория sublime-text (apt)
  ansible.builtin.apt_repository:
    repo: 'deb [signed-by=/etc/apt/keyrings/sublimehq-archive.gpg] https://download.sublimetext.com/ apt/stable/'
    state: present
    filename: 'sublime-text'
    update_cache: true
  when: ansible_os_family == 'Debian'

- name: Добавление репозитория sublime-text (dnf)
  ansible.builtin.dnf:
    name: "https://download.sublimetext.com/rpms/stable/x86_64/sublime-text-{{ sublime_text_version | default('latest') }}.x86_64.rpm"
    state: present
    disable_gpg_check: yes
  when: ansible_os_family == 'RedHat'

- name: Установка sublime-text (apt)
  ansible.builtin.apt:
    name: sublime-text
    state: present
  when: ansible_os_family == 'Debian'
