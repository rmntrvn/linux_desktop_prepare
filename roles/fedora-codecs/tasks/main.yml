---
- name: Проверка Fedora 45
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Fedora'
      - ansible_facts['distribution_major_version'] == '45'
    fail_msg: "Роль fedora-codecs предназначена только для Fedora 45."

- name: Проверка репозитория Cisco OpenH264
  ansible.builtin.stat:
    path: /usr/share/dnf5/repos.d/fedora-cisco-openh264.repo
  register: fedora_cisco_openh264_repo

- name: Отключение репозитория Cisco OpenH264
  community.general.ini_file:
    path: /usr/share/dnf5/repos.d/fedora-cisco-openh264.repo
    section: fedora-cisco-openh264
    option: enabled
    value: '0'
    mode: '0644'
    no_extra_spaces: true
  when:
    - fedora_codecs_disable_cisco_openh264
    - fedora_cisco_openh264_repo.stat.exists

- name: Удаление пакетов Cisco OpenH264
  ansible.builtin.dnf:
    name:
      - mozilla-openh264
      - gstreamer1-plugin-openh264
    state: absent
  when: fedora_codecs_remove_cisco_packages

- name: Download RPM Fusion Free release package
  ansible.builtin.command:
    argv:
      - curl
      - --fail
      - --silent
      - --show-error
      - --location
      - "{{ fedora_codecs_rpmfusion_free_release_url }}-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
      - --output
      - "/tmp/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
    creates: "/tmp/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
  when: fedora_codecs_install_rpmfusion_free

- name: Установка RPM Fusion Free
  ansible.builtin.command:
    argv:
      - dnf
      - install
      - --assumeyes
      - --nogpgcheck
      - "/tmp/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
  when: fedora_codecs_install_rpmfusion_free
  register: fedora_codecs_rpmfusion_install
  changed_when: fedora_codecs_rpmfusion_install.rc == 0

- name: Remove temporary RPM Fusion Free release package
  ansible.builtin.file:
    path: "/tmp/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
    state: absent
  when: fedora_codecs_install_rpmfusion_free

- name: Установка свободных мультимедийных кодеков
  ansible.builtin.dnf:
    name: "{{ fedora_codecs_packages }}"
    state: present
    update_cache: true
    allowerasing: true
