---
- name: Validate supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] in ['Ubuntu', 'Fedora']
      - ansible_facts['distribution'] != 'Ubuntu' or ansible_facts['distribution_version'] is version('26.04', '==')
    fail_msg: Tailscale role supports Ubuntu 26.04 and Fedora.

- name: Install Tailscale dependencies (Ubuntu)
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Create Tailscale keyrings directory (Ubuntu)
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Download Tailscale signing key (Ubuntu)
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: '0644'
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Add Tailscale repository (Ubuntu)
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts['distribution_release'] }}.tailscale-keyring.list"
    dest: /etc/apt/sources.list.d/tailscale.list
    owner: root
    group: root
    mode: '0644'
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Install Tailscale (Ubuntu)
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Install Tailscale dependencies (Fedora)
  ansible.builtin.dnf:
    name:
      - ca-certificates
      - curl
    state: present
  when:
    - ansible_facts['distribution'] == 'Fedora'

- name: Add Tailscale repository (Fedora)
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/fedora/tailscale.repo
    dest: /etc/yum.repos.d/tailscale.repo
    owner: root
    group: root
    mode: '0644'
  when: ansible_facts['distribution'] == 'Fedora'

- name: Install Tailscale (Fedora)
  ansible.builtin.dnf:
    name: tailscale
    state: present
  when: ansible_facts['distribution'] == 'Fedora'

- name: Enable and start tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started
  when: ansible_facts['service_mgr'] == 'systemd'

- name: Check installed Tailscale version
  ansible.builtin.command: tailscale version
  register: tailscale_installed_version
  changed_when: false
  failed_when: false

- name: Display installed Tailscale version
  ansible.builtin.debug:
    msg: "Установлена версия Tailscale: {{ tailscale_installed_version.stdout | default('Не удалось определить') }}"
