---

- name: Install dependencies (apt)
  ansible.builtin.apt:
    name:
      - apt-transport-https 
      - ca-certificates
      - dirmngr
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Create APT keyrings directory (apt)
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: ansible_facts['os_family'] == 'Debian'

- name: Download ClickHouse GPG key (apt)
  ansible.builtin.get_url:
    url: https://packages.clickhouse.com/CLICKHOUSE-KEY.GPG
    dest: /etc/apt/keyrings/clickhouse.gpg
    mode: '0644'
  when: ansible_facts['os_family'] == 'Debian'

- name: Add clickhouse repository (apt)
  ansible.builtin.deb822_repository:
    name: clickhouse
    types: deb
    uris: https://packages.clickhouse.com/deb
    suites: stable
    components: [main]
    signed_by: /etc/apt/keyrings/clickhouse.gpg
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Update cache (apt)
  ansible.builtin.apt: 
    name: clickhouse-client
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Install clickhouse GPG key (dnf)
  ansible.builtin.rpm_key:
    key: 'https://packages.clickhouse.com/rpm/stable/repodata/repomd.xml.key'
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install clickhouse repo (dnf)
  become: true
  ansible.builtin.yum_repository:
    name: 'clickhouse'
    description: ClickHouse - Stable Repository
    enabled: true
    file: clickhouse
    baseurl: 'https://packages.clickhouse.com/rpm/stable/'
    gpgkey: 'https://packages.clickhouse.com/rpm/stable/repodata/repomd.xml.key'
    gpgcheck: 1
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install clickhouse-client (dnf) 
  ansible.builtin.dnf:
    name: clickhouse-client
    state: present
    update_cache: true
    # ClickHouse currently publishes this RPM without an OpenPGP signature.
    disable_gpg_check: true
  when: ansible_facts['os_family'] == 'RedHat'
