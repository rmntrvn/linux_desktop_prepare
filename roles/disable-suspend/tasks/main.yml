---
- name: Create systemd-logind drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - ansible_facts['service_mgr'] == 'systemd'
    - ansible_facts['os_family'] in ['Debian', 'RedHat']

- name: Disable automatic suspend in systemd-logind
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/disable-suspend.conf
    content: "{{ disable_suspend_logind_config }}\n"
    owner: root
    group: root
    mode: '0644'
  when:
    - ansible_facts['service_mgr'] == 'systemd'
    - ansible_facts['os_family'] in ['Debian', 'RedHat']
  notify: Restart systemd-logind
