---

- name: Install dependencies (apt)
  ansible.builtin.apt:
    name:
      - gpg
      - openjdk-17-jdk
      - openjdk-17-jre
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Create APT keyrings dir (apt)
  ansible.builtin.file:
    path: '/etc/apt/keyrings'
    state: directory
    mode: 'u=rwx,go=rx'
  when: ansible_facts['os_family'] == 'Debian'

- name: Download DBeaver GPG key (apt)
  ansible.builtin.get_url:
    url: 'https://dbeaver.io/debs/dbeaver.gpg.key'
    dest: '/etc/apt/keyrings/dbeaver.asc'
    mode: 'u=rw,go=r'
    force: yes
  when: ansible_facts['os_family'] == 'Debian'

- name: Dearmor DBeaver GPG key (apt)
  ansible.builtin.command:
    cmd: gpg --dearmor --yes -o /etc/apt/keyrings/dbeaver.gpg /etc/apt/keyrings/dbeaver.asc
    creates: /etc/apt/keyrings/dbeaver.gpg
  when: ansible_facts['os_family'] == 'Debian'

- name: Add dbeaver repository (apt)
  ansible.builtin.apt_repository:
    repo: 'deb [signed-by=/etc/apt/keyrings/dbeaver.gpg] https://dbeaver.io/debs/dbeaver-ce /'
    state: present
    filename: 'dbeaver'
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Install dbeaver (apt)
  ansible.builtin.apt:
    name: 'dbeaver-ce'
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Install dbeaver  (dnf)
  ansible.builtin.dnf:
    name: "https://dbeaver.io/files/dbeaver-ce-latest-stable.x86_64.rpm"
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'RedHat'
