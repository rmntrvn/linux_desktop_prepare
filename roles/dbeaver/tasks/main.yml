---

- name: Install dependencies (apt)
  ansible.builtin.apt:
    name:
      - gpg
      - openjdk-17-jdk
      - openjdk-17-jre
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Create APT keyrings dir (apt)
  ansible.builtin.file:
    path: '/etc/apt/keyrings'
    state: directory
    mode: 'u=rwx,go=rx'
  when: ansible_facts['os_family'] == 'Debian'

- name: Download DBeaver GPG key (apt)
  ansible.builtin.get_url:
    url: 'https://dbeaver.io/debs/dbeaver.gpg.key'
    dest: '/etc/apt/keyrings/dbeaver.asc'
    mode: 'u=rw,go=r'
    force: yes
  when: ansible_facts['os_family'] == 'Debian'

- name: Dearmor DBeaver GPG key (apt)
  ansible.builtin.command:
    cmd: gpg --dearmor --yes -o /etc/apt/keyrings/dbeaver.gpg /etc/apt/keyrings/dbeaver.asc
    creates: /etc/apt/keyrings/dbeaver.gpg
  when: ansible_facts['os_family'] == 'Debian'

- name: Add dbeaver repository (apt)
  ansible.builtin.deb822_repository:
    name: dbeaver
    types: deb
    uris: https://dbeaver.io/debs/dbeaver-ce
    suites: /
    components: []
    signed_by: /etc/apt/keyrings/dbeaver.gpg
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Install dbeaver (apt)
  ansible.builtin.apt:
    name: 'dbeaver-ce'
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Download dbeaver (dnf)
  ansible.builtin.command:
    argv:
      - curl
      - --fail
      - --silent
      - --show-error
      - --location
      - https://dbeaver.io/files/dbeaver-ce-latest-stable.x86_64.rpm
      - --output
      - /tmp/dbeaver-ce-latest-stable.x86_64.rpm
    creates: /tmp/dbeaver-ce-latest-stable.x86_64.rpm
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install dbeaver (dnf)
  ansible.builtin.command:
    argv:
      - dnf
      - install
      - --assumeyes
      - --nogpgcheck
      - /tmp/dbeaver-ce-latest-stable.x86_64.rpm
  register: dbeaver_install
  changed_when: dbeaver_install.rc == 0
  when: ansible_facts['os_family'] == 'RedHat'

- name: Remove downloaded dbeaver package
  ansible.builtin.file:
    path: /tmp/dbeaver-ce-latest-stable.x86_64.rpm
    state: absent
  when: ansible_facts['os_family'] == 'RedHat'
