---

- name: Install dependencies (apt)
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Create APT keyrings dir (apt)
  ansible.builtin.file:
    path: '/etc/apt/keyrings'
    state: directory
    mode: 'u=rwx,go=rx'
  when: ansible_facts['os_family'] == 'Debian'

- name: Install key (apt)
  ansible.builtin.get_url:
    url: 'https://download.docker.com/linux/debian/gpg'
    dest: '/etc/apt/keyrings/docker.gpg'
    mode: 'u=rw,go=r'
    force: yes
  when: ansible_facts['os_family'] == 'Debian'

- name: Add Docker repository (apt)
  ansible.builtin.apt_repository:
    repo: 'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu jammy stable'
    state: present
    filename: 'docker'
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Install Docker packages (apt)
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io-
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Uninstall old version docker (dnf)
  ansible.builtin.dnf:
    name:
      - docker
      - docker-client
      - docker-client-latest
      - docker-common
      - docker-latest
      - docker-latest-logrotate
      - docker-logrotate
      - docker-selinux
      - docker-engine-selinux
      - docker-engine
    state: absent
    autoremove: true
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install Docker repo (dnf)
  become: true
  ansible.builtin.yum_repository:
    name: 'docker'
    description: Docker Community Edition
    enabled: true
    file: docker-ce
    baseurl: 'https://download.docker.com/linux/fedora/docker-ce.repo'
    gpgcheck: 1
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install Docker  (dnf)
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'RedHat'