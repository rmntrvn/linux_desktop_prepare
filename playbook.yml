---

- name: Install basic components
  hosts: localhost
  become: true
  gather_facts: true
  vars:
    generic_package_names:
      RedHat:
        - ca-certificates
        - cups
        - curl
        - dmidecode
        - fastfetch
        - filezilla
        - fping
        - gimp
        - git
        - gnupg2
        - htop
        - inkscape
        - iperf3
        - jq
        - keepassxc
        - make
        - mc
        - net-tools
        - nmap
        - obs-studio
        - openconnect
        - pavucontrol
        - postgresql
        - pwgen
        - qbittorrent
        - remmina
        - s3cmd
        - sshpass
        - tcpdump
        - telnet
        - testdisk
        - thunderbird
        - vim-enhanced
        - vlc
        - vokoscreenNG
        - wget
        - whois
        - wireguard-tools
        - wireshark
        - xclip
      Debian:
        - apt-transport-https
        - ca-certificates
        - cups
        - curl
        - dirmngr
        - dmidecode
        - filezilla
        - fping
        - gimp
        - git
        - gnupg
        - htop
        - inkscape
        - iperf3
        - jq
        - keepassxc
        - make
        - mc
        - neofetch
        - net-tools
        - nmap
        - obs-studio
        - openconnect
        - pavucontrol
        - peek
        - postgresql-client
        - pwgen
        - qbittorrent
        - remmina
        - resolvconf
        - s3cmd
        - shadowsocks-libev
        - simplescreenrecorder
        - sshpass
        - tcpdump
        - telnet
        - testdisk
        - thunderbird
        - vim
        - vlc
        - vokoscreen
        - wget
        - whois
        - wireguard
        - wireshark
        - xclip
  roles:
    - role: install-packages
  tags:
    - install-packages

- name: Set hostname
  hosts: localhost
  become: true
  gather_facts: true
  roles:
    - role: hostname
  tags:
    - hostname

- name: Install wireproxy-awg
  hosts: localhost
  become: true
  gather_facts: true
  vars:
    wireproxy_config_file: ""
  roles:
    - role: wireproxy-awg

- name: Install VS Code
  hosts: localhost
  become: true
  gather_facts: true
  roles:
    - role: vscode

- name: Install dbeaver
  hosts: localhost
  become: true
  gather_facts: true
  roles:
    - role: dbeaver

- name: Install clickhouse-client
  hosts: localhost
  become: true
  gather_facts: true
  roles:
    - role: clickhouse-client

- name: Optimize dnf for Fedora
  hosts: localhost
  become: true
  gather_facts: true
  tasks:
    - ansible.builtin.include_role:
        name: dnf-optimization
      when: ansible_facts['os_family'] == 'RedHat' and ansible_facts['distribution'] == 'Fedora'
  tags:
    - dnf-optimization

- name: Configure Fedora free codecs
  hosts: localhost
  become: true
  gather_facts: true
  tasks:
    - ansible.builtin.include_role:
        name: fedora-codecs
      when: ansible_facts['distribution'] == 'Fedora'
  tags:
    - fedora-codecs

- name: Install sublime-text
  hosts: localhost
  become: true
  gather_facts: true
  roles:
    - role: sublime-text

- name: Install hashicorp
  hosts: localhost
  become: true
  gather_facts: true
  vars:
    hashicorp_packages:
      - terraform
      - packer
      - vault
  roles:
    - role: hashicorp

- name: Install kubernetes kubectl
  hosts: localhost
  become: true
  gather_facts: true
  roles:
    - role: kubernetes

- name: Install helm
  hosts: localhost
  become: true
  gather_facts: true
  roles:
    - role: helm

- name: Install zsh
  hosts: localhost
  become: true
  gather_facts: true
  vars:
    zsh_theme: ys
    zsh_plugins:
      - git
      - zsh-syntax-highlighting
      - zsh-autosuggestions
      - fzf
  roles:
    - role: zsh

- name: Install kubie
  hosts: localhost
  become: true
  gather_facts: true
  vars:
    kubie_config_file: |
      ""
  roles:
    - role: kubie

- name: Install Vivaldi browser
  hosts: localhost
  become: true
  gather_facts: true
  roles:
    - role: vivaldi

- name: Install Time Messenger
  hosts: localhost
  become: true
  gather_facts: true
  roles:
    - role: time-messenger

- name: Install flathub packages
  hosts: localhost
  become: true
  gather_facts: true
  vars:
    flatpak_packages:
      - org.telegram.desktop
  roles:
    - role: flathub

- name: Install Tailscale client
  hosts: localhost
  become: true
  gather_facts: true
  vars:
    tailscale_version: ""
  roles:
    - role: tailscale

- name: Install Docker/Podman
  hosts: localhost
  become: true
  gather_facts: true
  vars:
    docker_version: ""
    docker_user: "{{ ansible_env.SUDO_USER | default(lookup('env', 'USER')) | default('rmntrvn') }}"
  roles:
    - role: containers

- name: Install OpenCode and codebase-memory-mcp
  hosts: localhost
  become: true
  gather_facts: true
  vars:
    opencode_user: "{{ ansible_env.SUDO_USER | default(lookup('env', 'USER')) | default('rmntrvn') }}"
  roles:
    - role: opencode
  tags:
    - opencode
    - codebase-memory-mcp
