---

- name: Optimize dnf for Fedora
  hosts: localhost
  become: true
  gather_facts: true
  tasks:
    - ansible.builtin.include_role:
        name: dnf-optimization
      when: ansible_facts['os_family'] == 'RedHat' and ansible_facts['distribution'] == 'Fedora'
  tags:
    - dnf-optimization

- name: Configure Fedora Yandex mirrors
  hosts: localhost
  become: true
  gather_facts: true
  roles:
    - role: fedora-yandex-mirrors
  tags:
    - fedora-yandex-mirrors

- name: Configure Fedora free codecs
  hosts: localhost
  become: true
  gather_facts: true
  tasks:
    - ansible.builtin.include_role:
        name: fedora-codecs
      when: ansible_facts['distribution'] == 'Fedora'
  tags:
    - fedora-codecs

- name: Install basic components
  hosts: localhost
  become: true
  gather_facts: true
  vars:
    generic_package_names:
      RedHat:
        - ca-certificates
        - cups
        - curl
        - dmidecode
        - fastfetch
        - filezilla
        - fping
        - gimp
        - git
        - gnupg2
        - htop
        - inkscape
        - iperf3
        - jq
        - keepassxc
        - make
        - mc
        - net-tools
        - nmap
        - obs-studio
        - openconnect
        - pavucontrol
        - postgresql
        - pwgen
        - qbittorrent
        - remmina
        - s3cmd
        - sshpass
        - tcpdump
        - telnet
        - testdisk
        - thunderbird
        - vim-enhanced
        - vlc
        - vokoscreenNG
        - wget
        - whois
        - wireguard-tools
        - wireshark
        - xclip
      Debian:
        - apt-transport-https
        - ca-certificates
        - cups
        - curl
        - dirmngr
        - dmidecode
        - filezilla
        - fping
        - gimp
        - git
        - gnupg
        - htop
        - inkscape
        - iperf3
        - jq
        - keepassxc
        - make
        - mc
        - neofetch
        - net-tools
        - nmap
        - obs-studio
        - openconnect
        - pavucontrol
        - peek
        - postgresql-client
        - python3-debian
        - pwgen
        - qbittorrent
        - remmina
        - resolvconf
        - s3cmd
        - shadowsocks-libev
        - simplescreenrecorder
        - sshpass
        - tcpdump
        - telnet
        - testdisk
        - thunderbird
        - vim
        - vlc
        - vokoscreen
        - wget
        - whois
        - wireguard
        - wireshark
        - xclip
  roles:
    - role: install-packages
    - role: disable-suspend
  tags:
    - install-packages
    - disable-suspend

- name: Set hostname
  hosts: localhost
  become: true
  gather_facts: true
  roles:
    - role: hostname
  tags:
    - hostname

- name: Install wireproxy-awg
  hosts: localhost
  become: true
  gather_facts: true
  vars:
    wireproxy_config_file: ""
  roles:
    - role: wireproxy-awg
  tags:
    - wireproxy-awg

- name: Install VS Code
  hosts: localhost
  become: true
  gather_facts: true
  roles:
    - role: vscode
  tags:
    - vscode

- name: Install dbeaver
  hosts: localhost
  become: true
  gather_facts: true
  roles:
    - role: dbeaver
  tags:
    - dbeaver

- name: Install clickhouse-client
  hosts: localhost
  become: true
  gather_facts: true
  roles:
    - role: clickhouse-client
  tags:
    - clickhouse-client

- name: Install sublime-text
  hosts: localhost
  become: true
  gather_facts: true
  roles:
    - role: sublime-text
  tags:
    - sublime-text

- name: Install hashicorp
  hosts: localhost
  become: true
  gather_facts: true
  vars:
    hashicorp_enabled: false
    hashicorp_packages:
      - terraform
      - packer
      - vault
  pre_tasks:
    - name: Remove disabled HashiCorp repository on Fedora
      ansible.builtin.file:
        path: /etc/yum.repos.d/hashicorp.repo
        state: absent
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - not (hashicorp_enabled | bool)
  roles:
    - role: hashicorp
      when: hashicorp_enabled | bool
  tags:
    - hashicorp

- name: Install kubernetes kubectl
  hosts: localhost
  become: true
  gather_facts: true
  roles:
    - role: kubernetes
  tags:
    - kubernetes

- name: Install helm
  hosts: localhost
  become: true
  gather_facts: true
  roles:
    - role: helm
  tags:
    - helm

- name: Install zsh
  hosts: localhost
  become: true
  gather_facts: true
  vars:
    zsh_theme: ys
    zsh_plugins:
